# Pulsar OS — configuração do ambiente (pulsar.cfg)
# Edite aqui ou em Configurações; o desktop aplica ao salvar.
# theme: light|dark  accent: azul|roxo|rosa|vermelho|laranja|amarelo|verde|grafite
# wallpaper: aurora|ondas|oceano|por-do-sol|grafite|nebulosa
# resolution: 1024x768|1280x720|1280x800|1366x768|1440x900|1600x900|1920x1080|1920x1200|2560x1440
# dock.size: small|medium|large  dock.position: bottom|left  keyboard: abnt|abnt2|us|us-intl
# dock.click_minimizes: on = clicar no app em foco minimiza (como no Windows)

theme=light
accent=azul
wallpaper=aurora
resolution=1280x800
dock.size=medium
dock.magnify=off
dock.position=bottom
dock.click_minimizes=off
clock.24h=on
clock.seconds=off
menubar.cpu=on
glass=on
keyboard=abnt2
