<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Pulsar OS: fontes padrao dos programas Linux (fontconfig).
     Carregado por conf.d/51-local.conf, antes das preferencias genericas de
     60-latin.conf. As fontes ficam em /usr/share/fonts/pulsar: Noto (texto),
     Liberation (mesmas metricas de Arial, Times New Roman e Courier New: os
     apelidos vem de 30-metric-aliases.conf), DejaVu Sans (simbolos) e Noto
     para arabe, hebraico e devanagari. Cada escrita tem a sua Noto antes da
     DejaVu (que tambem cobre arabe e hebraico, mas so como reserva). -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Naskh Arabic</family><family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Naskh Arabic</family><family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Liberation Mono</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
